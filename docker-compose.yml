services:

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: flashseat
      POSTGRES_PASSWORD: flashseat
      POSTGRES_DB: flashseat

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro

    api:

      build:
        ./apps/api

      environment:
        development:
          NODE_ENV: development

        PORT: 8080

        DATABASE_URL: postgres://flashseat:flashseat@postgres:5432/flashseat

        CORS_ORIGINS: http://localhost:3000

      ports:
        - "8080:8080"

    web:

      build:
        ./apps/web

      ports:
        - "3000:3000"

      depends_on:
        - api

volumes:
  postgres_data: